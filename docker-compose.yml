services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slop
      POSTGRES_USER: slop
      POSTGRES_PASSWORD: slop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slop"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      SITE_NAME: ${SITE_NAME:-NAZWA_ROBOCZA}
      SITE_URL: http://localhost:8000
      POSTGRES_HOST: db
      POSTGRES_DB: slop
      POSTGRES_USER: slop
      POSTGRES_PASSWORD: slop
      REDIS_URL: redis://redis:6379/0
      HUEY_IMMEDIATE: "0"
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private_media
    volumes:
      - .:/app
      - media:/app/media
      - private_media:/app/private_media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: python manage.py run_huey
    environment:
      DJANGO_DEBUG: "1"
      SITE_NAME: ${SITE_NAME:-NAZWA_ROBOCZA}
      SITE_URL: http://web:8000
      POSTGRES_HOST: db
      POSTGRES_DB: slop
      POSTGRES_USER: slop
      POSTGRES_PASSWORD: slop
      REDIS_URL: redis://redis:6379/0
      HUEY_IMMEDIATE: "0"
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private_media
    volumes:
      - .:/app
      - media:/app/media
      - private_media:/app/private_media
    depends_on:
      - web
      - redis

volumes:
  pgdata:
  media:
  private_media:
